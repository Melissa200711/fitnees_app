name: fitness_app
description: Fitness App con sensores (huella, podómetro, acelerómetro, giroscopio) y GPS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Autenticación biométrica (huella / rostro)
  local_auth: ^2.3.0
  # Permisos en tiempo de ejecución
  permission_handler: ^11.3.1
  # Podómetro (STEP_COUNTER)
  pedometer: ^4.0.2
  # Acelerómetro y giroscopio
  sensors_plus: ^6.0.1
  # GPS
  geolocator: ^13.0.1
  # Mapa (OpenStreetMap, no necesita API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Persistencia local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true